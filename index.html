<style>
/* ============================================================
   CENTRO — Personal Control Center
   Design tokens
   ============================================================ */
:root {
  /* Color */
  --bg: #0A0C0F;
  --bg-elev-1: #12151A;
  --bg-elev-2: #1A1E25;
  --bg-elev-3: #232833;
  --hairline: #262B34;
  --text: #F1EFE9;
  --text-dim: #9AA0AC;
  --text-faint: #5D636E;
  --accent: #E3A857; /* amber — primary signature accent */
  --accent-dim: #8A6A3B;
  --accent-glow: rgba(227, 168, 87, 0.18);
  --cyan: #57C7C2; /* water / positive secondary */
  --green: #6FCF97; /* gains / completed */
  --red: #E2685C; /* losses / warnings */
  --blue: #6E9BD8; /* trading */

  /* Type */
  --font-display: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
  --font-body: 'Inter', ui-sans-serif, system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;

  /* Radii / spacing */
  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --nav-h: 64px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
body {
  height: 100dvh;
  overflow: hidden;
}
#root {
  height: 100dvh;
  display: flex;
  flex-direction: column;
}
button {
  font-family: inherit;
  border: none;
  background: none;
  color: inherit;
  cursor: pointer;
}
input, textarea, select {
  font-family: inherit;
  color: var(--text);
  background: var(--bg-elev-2);
  border: 1px solid var(--hairline);
  border-radius: var(--r-sm);
  padding: 10px 12px;
  font-size: 15px;
  outline: none;
}
input:focus, textarea:focus, select:focus,
button:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
a { color: var(--accent); text-decoration: none; }

::-webkit-scrollbar { width: 0; height: 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
  }
}

/* ---------- Layout shell ---------- */
.app-header {
  padding: calc(14px + var(--safe-top)) 20px 14px;
  flex-shrink: 0;
}
.app-header .eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--accent);
  text-transform: uppercase;
}
.app-header h1 {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 600;
  margin: 2px 0 0;
  letter-spacing: -0.01em;
}
.screen {
  flex: 1;
  overflow-y: auto;
  padding: 0 16px calc(var(--nav-h) + 24px + var(--safe-bottom));
}
.screen-title {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 600;
  margin: 10px 4px 14px;
}

/* ---------- Bottom nav ---------- */
.bottom-nav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: calc(var(--nav-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: rgba(18, 21, 26, 0.92);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--hairline);
  display: flex;
  z-index: 50;
  overflow-x: auto;
  overflow-y: hidden;
  justify-content: flex-start;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.nav-item {
  flex: 0 0 78px;
  min-width: 78px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: var(--text-faint);
  font-size: 10.5px;
  font-family: var(--font-mono);
  letter-spacing: 0.02em;
  transition: color 0.2s ease;
}
.nav-item .icon { font-size: 19px; line-height: 1; filter: grayscale(1); opacity: 0.6; transition: all 0.2s ease; }
.nav-item.active { color: var(--accent); }
.nav-item.active .icon { filter: none; opacity: 1; transform: translateY(-1px); }

/* ---------- Card ---------- */
.card {
  background: var(--bg-elev-1);
  border: 1px solid var(--hairline);
  border-radius: var(--r-lg);
  padding: 18px;
  margin-bottom: 12px;
}
.card-title {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin: 0 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* ---------- Progress bar ---------- */
.bar-track {
  height: 8px;
  background: var(--bg-elev-3);
  border-radius: 99px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--accent-dim), var(--accent));
  transition: width 0.5s cubic-bezier(.2,.8,.2,1);
}

/* ---------- Checklist item (habit/task) ---------- */
.check-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 4px;
  border-bottom: 1px solid var(--hairline);
  transition: opacity 0.45s ease, transform 0.45s ease, max-height 0.45s ease, padding 0.45s ease, margin 0.45s ease;
  max-height: 60px;
  overflow: hidden;
}
.check-row:last-child { border-bottom: none; }
.check-row.completing {
  opacity: 0;
  transform: translateX(24px) scale(0.97);
  max-height: 0;
  padding-top: 0; padding-bottom: 0;
  margin: 0;
  border-bottom-color: transparent;
}
.check-circle {
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 2px solid var(--text-faint);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.25s ease;
}
.check-circle.checked {
  border-color: var(--green);
  background: var(--green);
}
.check-circle.checked::after {
  content: '✓';
  color: #08130D;
  font-size: 13px;
  font-weight: 700;
}
.check-label { flex: 1; font-size: 15px; }
.check-meta { font-size: 12px; color: var(--text-faint); font-family: var(--font-mono); }

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-faint);
}
.empty-state .glyph { font-size: 28px; margin-bottom: 8px; display:block; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 18px;
  border-radius: var(--r-sm);
  font-size: 14px;
  font-weight: 600;
  font-family: var(--font-body);
}
.btn-primary { background: var(--accent); color: #201404; }
.btn-ghost { background: var(--bg-elev-2); color: var(--text); border: 1px solid var(--hairline); }
.btn-danger { background: rgba(226,104,92,0.14); color: var(--red); border: 1px solid rgba(226,104,92,0.3); }
.btn-block { width: 100%; }
.btn-sm { padding: 8px 12px; font-size: 13px; }
.fab {
  position: fixed;
  right: 20px;
  bottom: calc(var(--nav-h) + 20px + var(--safe-bottom));
  width: 52px; height: 52px;
  border-radius: 50%;
  background: var(--accent);
  color: #201404;
  font-size: 24px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 24px var(--accent-glow);
  z-index: 40;
}

/* ---------- Modal / sheet ---------- */
.sheet-backdrop {
  position: fixed; inset: 0;
  background: rgba(6,7,9,0.65);
  backdrop-filter: blur(2px);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  animation: fadeIn 0.2s ease;
}
.sheet {
  background: var(--bg-elev-1);
  border: 1px solid var(--hairline);
  border-bottom: none;
  border-radius: 24px 24px 0 0;
  width: 100%;
  max-height: 88dvh;
  overflow-y: auto;
  padding: 10px 20px calc(24px + var(--safe-bottom));
  animation: slideUp 0.28s cubic-bezier(.2,.8,.2,1);
}
.sheet-handle {
  width: 36px; height: 4px;
  background: var(--hairline);
  border-radius: 99px;
  margin: 6px auto 16px;
}
.sheet h2 { font-family: var(--font-display); font-size: 19px; margin: 0 0 16px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; font-family: var(--font-mono); letter-spacing: 0.03em; }
.field input, .field textarea, .field select { width: 100%; }
.segmented {
  display: flex;
  background: var(--bg-elev-2);
  border-radius: var(--r-sm);
  padding: 3px;
  border: 1px solid var(--hairline);
}
.segmented button {
  flex: 1;
  padding: 9px 6px;
  font-size: 13px;
  border-radius: 7px;
  color: var(--text-dim);
  text-align: center;
}
.segmented button.active { background: var(--bg-elev-3); color: var(--text); }
.sheet-actions { display: flex; gap: 10px; margin-top: 18px; }
.sheet-actions .btn { flex: 1; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

/* ---------- Ring gauge (signature element) ---------- */
.ring-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }
.ring-wrap svg { transform: rotate(-90deg); }
.ring-track { fill: none; stroke: var(--bg-elev-3); }
.ring-fill { fill: none; stroke-linecap: round; transition: stroke-dashoffset 0.6s cubic-bezier(.2,.8,.2,1); }
.ring-center { position: absolute; text-align: center; }
.ring-center .num { font-family: var(--font-display); font-weight: 700; line-height: 1; }
.ring-center .label { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); letter-spacing: 0.06em; margin-top: 4px; }

/* ---------- Grid ---------- */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat-tile { background: var(--bg-elev-2); border-radius: var(--r-md); padding: 14px; }
.stat-tile .v { font-family: var(--font-mono); font-size: 19px; font-weight: 600; }
.stat-tile .k { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

.pill {
  display: inline-block;
  padding: 3px 9px;
  border-radius: 99px;
  font-size: 11px;
  font-family: var(--font-mono);
  background: var(--bg-elev-3);
  color: var(--text-dim);
}
.pill.warn { background: rgba(226,104,92,0.15); color: var(--red); }
.pill.good { background: rgba(111,207,151,0.15); color: var(--green); }

.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.icon-btn { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--bg-elev-2); }
.swipe-item { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--hairline); }
.swipe-item:last-child { border-bottom: none; }

/* ---------- Theme ---------- */
:root[data-theme="light"]{
  --bg:#f6f5f2;--bg-elev-1:#ffffff;--bg-elev-2:#f0eee9;--bg-elev-3:#e5e2db;--hairline:#ddd8cf;--text:#15171a;--text-dim:#6c6f76;--text-faint:#989a9f;--accent:#9a671a;--accent-dim:#c38e40;--accent-glow:rgba(154,103,26,.16);--cyan:#168c88;--green:#2c925d;--red:#be4b41;--blue:#4672ae;
}
body{transition:background .2s ease,color .2s ease}
.app-header.secondary{display:flex;align-items:center;gap:10px}
.app-header.secondary h1{font-size:20px}
.date-line{font-size:13px;color:var(--text-dim);margin-top:4px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 4px 10px}
.section-head h2{font-family:var(--font-display);font-size:18px;margin:0;font-weight:600}
.hero-grid{display:grid;grid-template-columns:1.35fr .95fr;gap:12px}
.metric-card{min-width:0}
.metric-line{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 12px}
.metric-line strong{font-family:var(--font-display);font-size:28px}.metric-line span{color:var(--text-dim)}.metric-line small{display:block;color:var(--text-faint);margin-top:4px;font-family:var(--font-mono);font-size:11px}
.round-btn{width:44px;height:44px;border-radius:50%;background:var(--bg-elev-3);font-size:22px}

.center-ring{display:flex;justify-content:center;margin:4px 0}.ring-wrap.big svg{width:180px;height:180px}.ring-wrap.big .num{font-size:28px}.ring-fill.accent{stroke:var(--accent)}.ring-fill.cyan{stroke:var(--cyan)}.ring-fill.cal{stroke:var(--green)}.ring-sub{font-size:9px;color:var(--text-faint);margin-top:4px;font-family:var(--font-mono)}

.water-actions{display:flex;gap:10px;margin-top:16px}.water-actions .btn:last-child{flex:1}
